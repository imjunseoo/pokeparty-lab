name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      refresh:
        description: 'PokeAPI·Smogon 데이터를 새로 받아서 배포'
        type: boolean
        default: true
  schedule:
    # 매월 3일 03:00 UTC — Smogon 월간 사용률 통계가 올라온 뒤 자동 갱신
    - cron: '0 3 3 * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      REFRESH: ${{ github.event_name == 'schedule' || inputs.refresh == true }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: 데이터 갱신 (PokeAPI + Smogon)
        if: env.REFRESH == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run data

      - name: 테스트
        run: npm test

      - name: 갱신된 데이터 커밋
        if: env.REFRESH == 'true'
        run: |
          if [ -n "$(git status --porcelain site/data)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add site/data
            git commit -m "chore(data): 포켓몬·실전 사용률 데이터 자동 갱신"
            git push
          else
            echo "변경된 데이터 없음"
          fi

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
